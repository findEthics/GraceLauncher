<!doctype html>
<meta charset="utf-8">
<script>
window.ai_edge_gallery_get_result = function (data) {
  try {
    const input = JSON.parse(data);
    if (!input || typeof input !== "object" || Array.isArray(input)) {
      throw new Error("invalid input");
    }
    const keys = Object.keys(input);
    if (keys.some((key) => key !== "time" && key !== "label") ||
        typeof input.time !== "string" ||
        (input.label !== undefined && typeof input.label !== "string") ||
        !/^(?:[01][0-9]|2[0-3]):[0-5][0-9]$/.test(input.time)) {
      throw new Error("invalid input");
    }
    const label = input.label || "";
    if (label.length > 80 || /[\u0000-\u001f\u007f]/.test(label)) {
      throw new Error("invalid input");
    }
    const [hour, minute] = input.time.split(":").map(Number);
    return JSON.stringify({
      result: JSON.stringify({ skill: "set-alarm", hour, minute, label })
    });
  } catch (_) {
    return JSON.stringify({ error: "Invalid set-alarm skill input." });
  }
};
</script>
