[project]
name = "memory-bridge"
version = "0.1.0"
description = "Desktop stdio MCP bridge to the Grace memory ledger"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.1", "httpx"]

[project.scripts]
memory-bridge = "memory_bridge.server:main"

[dependency-groups]
dev = ["pytest", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
